
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Golf Results</title>
  
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    .hero {
      margin-bottom: 22px;
    }
    h1 {
      font-size: 34px;
      margin: 0 0 4px;
    }
    h2 {
      margin: 0;
      font-size: 22px;
    }
    h3 {
      margin-top: 26px;
    }
    .sub {
      color: #64748b;
      margin: 4px 0;
    }
    .small {
      color: #64748b;
      font-size: 13px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0 24px;
    }
    .tab, .button {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      background: #0f172a;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .grid.two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 1px 3px rgba(15,23,42,.08);
      padding: 18px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .cardHead {
      margin: -18px -18px 14px;
      padding: 18px;
    }
    .green { background: #dcfce7; }
    .blue { background: #dbeafe; }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid #e2e8f0;
      padding: 9px 10px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #f8fafc;
      font-weight: 800;
    }
    td:first-child, th:first-child {
      text-align: left;
    }
    .scroll {
      overflow-x: auto;
    }
    .compact {
      max-width: 520px;
    }
    @media (max-width: 850px) {
      .grid.two {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Golf Results</h1>
    <p class="sub">Tournament archive</p>

    <section class="card">
      <h2>April-May 2026</h2>
      <p>Latest published results.</p>
      <a class="button" href="tournaments/2026-04-may/">View Tournament</a>
    </section>
  </main>
</body>
</html>
